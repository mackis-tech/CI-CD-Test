name: Node.js CI
on:
  push:
    branches: [test]
  pull_request:
    branches: [test]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: Install dependencies
        run: npm ci
      - name: Run Test 
        run : npm test
      - name: Package build output as zip
        run: |
          mkdir output
          cp -r src output/
          cp package.json output/
          zip -r build.zip output
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-zip
          path: build.zip

      - name: Install mailx and setup config
        run: |
          sudo apt-get update
          sudo apt-get install -y mailutils

          # Configure mailx with SMTP (Gmail example)
          echo "set smtp=smtp://smtp.gmail.com:587" >> ~/.mailrc
          echo "set smtp-auth=login" >> ~/.mailrc
          echo "set smtp-auth-user=${{ secrets.EMAIL_USERNAME }}" >> ~/.mailrc
          echo "set smtp-auth-password=${{ secrets.EMAIL_PASSWORD }}" >> ~/.mailrc
          echo "set from=${{ secrets.EMAIL_USERNAME }}" >> ~/.mailrc
          echo "set ssl-verify=ignore" >> ~/.mailrc
          echo "set nss-config-dir=/etc/pki/nssdb" >> ~/.mailrc
      - name: Notify upon success
        if: success()
        run: |
          echo "Build and tests passed successfully!"
          echo "Build and tests passed successfully!" | mail -s "CI Notification" finnyraj14@gmail.com
          